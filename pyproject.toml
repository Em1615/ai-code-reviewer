[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-reviewer"
version = "0.1.0"
description = "AI-powered code review for GitHub pull requests, backed by any model via OpenRouter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = []
# No third-party HTTP libraries: github.py and openrouter.py use urllib
# from the standard library on purpose, to keep the package lightweight
# and avoid version-conflict risk when installed inside arbitrary CI images.

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ai-reviewer = "ai_reviewer.cli:main"

[tool.setuptools.packages.find]
include = ["ai_reviewer*"]